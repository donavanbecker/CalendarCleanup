name: Release

# Pushing a tag like v1.2.0 builds, signs and notarizes Calendar Cleanup,
# then publishes it as a GitHub Release. See README.md for the required secrets.
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.0, got $TAG"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build
        run: |
          xcodebuild build \
            -project CalendarCleanupApp/CalendarCleanup.xcodeproj \
            -scheme CalendarCleanup \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          APP="$RUNNER_TEMP/build/Build/Products/Release/Calendar Cleanup.app"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "SPARKLE_BIN=$RUNNER_TEMP/build/SourcePackages/artifacts/sparkle/Sparkle/bin" >> "$GITHUB_ENV"

          # xcodebuild leaves Sparkle's nested helpers unsigned by us, and notarization
          # needs them all under Developer ID. Sign from the inside out.
          SIGN=(codesign --force --timestamp --options runtime --sign "Developer ID Application")
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          "${SIGN[@]}" "$SPARKLE/Versions/B/XPCServices/Installer.xpc"
          "${SIGN[@]}" --preserve-metadata=entitlements "$SPARKLE/Versions/B/XPCServices/Downloader.xpc"
          "${SIGN[@]}" "$SPARKLE/Versions/B/Autoupdate"
          "${SIGN[@]}" "$SPARKLE/Versions/B/Updater.app"
          "${SIGN[@]}" "$SPARKLE"
          "${SIGN[@]}" --preserve-metadata=entitlements "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          UPDATES="$RUNNER_TEMP/updates"
          mkdir "$UPDATES"
          ASSET="$UPDATES/Calendar-Cleanup-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ASSET"

          # The app reads appcast.xml from the latest release to find new versions.
          RELEASES="https://github.com/${GITHUB_REPOSITORY}/releases"
          echo "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" --ed-key-file - \
            --download-url-prefix "$RELEASES/download/$TAG/" \
            --full-release-notes-url "$RELEASES/tag/$TAG" \
            -o "$RUNNER_TEMP/appcast.xml" "$UPDATES"

          gh release create "$TAG" "$ASSET" "$RUNNER_TEMP/appcast.xml" \
            --title "Calendar Cleanup $VERSION" --generate-notes

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
